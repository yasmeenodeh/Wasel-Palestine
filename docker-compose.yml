name: advanced_wasel_palestine

services:
  db:
    image: mysql:8.0
    container_name: advanced_wasel_palestine_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: advanced_wasel_palestine
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: advanced_wasel_palestine_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: advanced_wasel_palestine
      DB_SYNCHRONIZE: "false"
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_LIMIT: 2000
      JWT_ACCESS_SECRET: wasel_access_secret
      JWT_REFRESH_SECRET: wasel_refresh_secret
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
      OPENROUTESERVICE_API_KEY: 5b3ce3597851110001cf62482a1520537959448fb30c5526d252e996
      OPENWEATHERMAP_API_KEY: 7f829285a87aa0f09abd8b979dcbc3e6
      OPENROUTESERVICE_TIMEOUT_MS: 8000
      OPENWEATHERMAP_TIMEOUT_MS: 8000
      OPENROUTESERVICE_RATE_LIMIT_PER_MINUTE: 30
      OPENWEATHERMAP_RATE_LIMIT_PER_MINUTE: 60
      EXTERNAL_ROUTE_CACHE_TTL_SECONDS: 900
      EXTERNAL_GEOCODE_CACHE_TTL_SECONDS: 86400
      EXTERNAL_WEATHER_CACHE_TTL_SECONDS: 600

volumes:
  mysql_data:
